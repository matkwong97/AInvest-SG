
name: Refresh market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve best-effort market snapshot
        run: python scripts/update_market.py
      - name: Commit snapshot if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update timestamped market snapshot'
            git push
          fi
